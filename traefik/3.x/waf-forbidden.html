<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Toegang geweigerd</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1c2024;--muted:#60646c;--border:#e0e1e6;--accent:#e5484d;--accent-bg:#feebec;--chip:#f0f0f3;--brand:#0b2046}
@media (prefers-color-scheme:dark){:root{--bg:#111113;--card:#1c1d20;--text:#edeef0;--muted:#9b9ea4;--border:#2e3135;--accent:#ff6369;--accent-bg:#3b1219;--chip:#232428;--brand:#dbe5f7}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.stage{position:relative;width:100%;max-width:480px;margin:auto 0}
.card{position:relative;z-index:1;padding:40px 32px 32px;background:var(--card);border:1px solid var(--border);border-radius:16px;border-top:4px solid var(--accent);text-align:center}
.head{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:16px}
.icon{display:grid;place-items:center;flex:none;width:64px;height:64px;border-radius:50%;background:var(--accent-bg);color:var(--accent)}
.icon svg{width:36px;height:36px}
.badge{position:absolute;top:16px;right:16px;padding:2px 8px;border-radius:6px;background:var(--accent-bg);color:var(--accent);font:600 12px ui-monospace,Menlo,monospace}
h1{margin:0;font-size:26px;text-align:left}
p{margin:0 0 28px;color:var(--muted)}
dl{margin:0;border:1px solid var(--border);border-radius:10px;text-align:left}
dl div{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;padding:12px 16px}
dl div+div{border-top:1px solid var(--border)}
dt{font-size:14px;color:var(--muted)}
dd{margin:0 0 0 auto;font:13px ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
dd span{padding:2px 6px;border-radius:6px;background:var(--chip)}
.hosted{display:flex;align-items:center;gap:6px;margin-top:24px;font-size:13px;color:var(--muted)}
.logo{display:flex;align-items:center;gap:.45em;font-size:15px;color:var(--brand);opacity:.55}
.w{height:1em}
.wm{height:.62em}
@media (max-width:480px){body{padding:16px}.card{padding:32px 20px 24px}h1{font-size:20px}.head{gap:12px}.icon{width:48px;height:48px}.icon svg{width:28px;height:28px}dl div{padding:10px 12px}dd{font-size:11.5px}}

body{padding-top:150px}
#waf{position:absolute;opacity:0}
label.icon{cursor:pointer}
.dog{position:absolute;top:0;right:28px;width:150px;transition:transform .4s}
.dog img{display:block;width:100%;height:auto}
.stage:has(label.icon:hover) .dog{transform:translateY(-10%)}
#waf:checked~.dog{transform:translateY(-72%)}
.bubble{position:absolute;top:6px;right:calc(100% + 6px);padding:6px 12px;font-weight:800;background:var(--card);border:2px solid var(--text);border-radius:12px;transform:rotate(-6deg);visibility:hidden}
.bubble::after{content:"";position:absolute;right:-9px;bottom:10px;width:14px;height:14px;background:var(--card);border:solid var(--text);border-width:0 2px 2px 0;transform:rotate(-45deg)}
#waf:checked~.dog .bubble{visibility:visible}
</style>
</head>
