include:
  - project: 'ventumsoftware/toolbox/gitlab-templates'
    file: 'dind-template.yml'

build-traefik-3.x:
    stage: build
    extends: .dind-template
    only:
      changes:
        - traefik/**/*
        - traefik/.gitlab-ci.yml
        - .gitlab-ci.yml
    script:
      - ./login.sh
      - ./build.sh ./traefik/3.x traefik:build-3-$CI_COMMIT_SHORT_SHA

tag-traefik:
  stage: tag
  extends: .dind-template
  only:
    refs:
      - main
    changes:
      - traefik/**/*
      - traefik/.gitlab-ci.yml
      - .gitlab-ci.yml
  script:
    - ./login.sh
    - ./tag.sh traefik:build-3-$CI_COMMIT_SHORT_SHA traefik:3
    - ./tag.sh traefik:3 traefik:latest

publish-traefik-ghcr:
  stage: tag
  extends: .dind-template
  needs: [tag-traefik]
  only:
    refs:
      - main
    changes:
      - traefik/**/*
      - traefik/.gitlab-ci.yml
      - .gitlab-ci.yml
  script:
    - ./login.sh
    - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
    - docker pull $CI_REGISTRY_IMAGE/traefik:build-3-$CI_COMMIT_SHORT_SHA
    - docker tag $CI_REGISTRY_IMAGE/traefik:build-3-$CI_COMMIT_SHORT_SHA ghcr.io/windhoos-bv/traefik:3
    - docker tag $CI_REGISTRY_IMAGE/traefik:build-3-$CI_COMMIT_SHORT_SHA ghcr.io/windhoos-bv/traefik:latest
    - docker push ghcr.io/windhoos-bv/traefik:3
    - docker push ghcr.io/windhoos-bv/traefik:latest
