<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Toegang geweigerd</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23e5484d' d='M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5z'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f4f5f7;
      --bg-accent: #e9ebf0;
      --card: #ffffff;
      --text: #1c2024;
      --muted: #60646c;
      --border: #e0e1e6;
      --danger: #e5484d;
      --danger-soft: #feebec;
      --code-bg: #f0f0f3;
      --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 12px 32px -8px rgba(0, 0, 0, .12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111113;
        --bg-accent: #18191b;
        --card: #1c1d20;
        --text: #edeef0;
        --muted: #9b9ea4;
        --border: #2e3135;
        --danger: #ff6369;
        --danger-soft: #3b1219;
        --code-bg: #232428;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px -8px rgba(0, 0, 0, .6);
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 10%, var(--bg-accent) 0, transparent 40%),
        radial-gradient(circle at 80% 90%, var(--bg-accent) 0, transparent 40%),
        var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      position: relative;
      width: 100%;
      max-width: 480px;
      animation: rise .4s ease-out both;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      padding: 40px 32px 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      text-align: center;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 4px;
      background: linear-gradient(90deg, var(--danger), #f76b15);
    }

    .icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      border-radius: 50%;
      background: var(--danger-soft);
      color: var(--danger);
    }

    .icon svg { width: 44px; height: 44px; }

    .code {
      display: inline-block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--danger);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -.01em;
    }

    .lead {
      margin: 0 0 28px;
      color: var(--muted);
    }

    .details {
      margin: 0 0 24px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 10px;
      text-align: left;
      overflow: hidden;
    }

    .details div {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 16px;
    }

    .details div + div { border-top: 1px solid var(--border); }

    .details dt {
      flex-shrink: 0;
      font-size: 14px;
      color: var(--muted);
    }

    .details dd {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 14px;
      text-align: right;
      word-break: break-all;
    }

    .details dd span {
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--code-bg);
    }

    .icon-header-container {
        display: flex;
        align-items: center;
        justify-content: start;
    }

    .icon-header-container .code {
        margin-left: 20px;
    }

    /* Easter egg: klik op het schild */
    .waf-toggle {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    label.icon {
      cursor: pointer;
      transition: transform .2s ease;
    }

    label.icon:hover { transform: rotate(-8deg) scale(1.05); }

    .waf-toggle:focus-visible ~ .card label.icon {
      outline: 2px solid var(--danger);
      outline-offset: 3px;
    }

    .dog {
      position: absolute;
      z-index: 0;
      top: 0;
      right: 28px;
      width: 150px;
      transition: transform .5s cubic-bezier(.34, 1.56, .64, 1);
    }

    .dog img {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, .2));
    }

    .stage:has(label.icon:hover) .dog { transform: translateY(-10%); }

    .waf-toggle:checked ~ .dog { transform: translateY(-72%); }

    .bubble {
      position: absolute;
      top: 6px;
      right: calc(100% + 6px);
      padding: 8px 14px;
      font-size: 20px;
      font-weight: 800;
      white-space: nowrap;
      color: var(--text);
      background: var(--card);
      border: 2px solid var(--text);
      border-radius: 14px;
      opacity: 0;
      transform: scale(.4) rotate(-10deg);
      transform-origin: 100% 100%;
      transition: opacity .15s ease, transform .3s cubic-bezier(.34, 1.56, .64, 1);
    }

    .bubble::after {
      content: "";
      position: absolute;
      right: -9px;
      bottom: 10px;
      width: 14px;
      height: 14px;
      background: var(--card);
      border-right: 2px solid var(--text);
      border-bottom: 2px solid var(--text);
      transform: rotate(-45deg);
    }

    .waf-toggle:checked ~ .dog .bubble {
      opacity: 1;
      transform: scale(1) rotate(-6deg);
      transition-delay: .35s;
    }

    .footer {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .stage { animation: none; }
      .dog, .bubble, label.icon { transition: none; }
    }

    @media (max-width: 480px) {
      .card { padding: 32px 20px 24px; }
      h1 { font-size: 22px; }
    }
  </style>
</head>

  <div class="stage">
  <input type="checkbox" id="waf-toggle" class="waf-toggle" aria-label="Verrassing">
  <div class="dog" aria-hidden="true">
